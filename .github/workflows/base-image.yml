# Builds ghcr.io/visiarch-sites/static-site-base whenever the shared Nginx setup changes.
name: Base image

on:
  push:
    branches: [main]
    paths: ["base/**", ".github/workflows/base-image.yml"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: base
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/static-site-base:latest
            ghcr.io/${{ github.repository_owner }}/static-site-base:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
